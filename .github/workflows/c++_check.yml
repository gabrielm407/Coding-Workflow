name: CI - Build, Lint, SAST (PR)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang clang-tidy cppcheck git wget tar

      - name: Install reviewdog CLI (prebuilt)
        run: |
          REV="v0.21.0"
          ASSET="reviewdog_${REV#v}_linux_amd64.tar.gz"
          URL="https://github.com/reviewdog/reviewdog/releases/download/${REV}/${ASSET}"
          wget -qO /tmp/reviewdog.tar.gz "$URL"
          sudo mkdir -p /usr/local/bin
          # try extracting the binary path directly, fallback to extracting all
          sudo tar -C /usr/local/bin -xzf /tmp/reviewdog.tar.gz reviewdog 2>/dev/null || sudo tar -C /usr/local/bin -xzf /tmp/reviewdog.tar.gz
          sudo chmod +x /usr/local/bin/reviewdog || true
          /usr/local/bin/reviewdog -version || true

      - name: Configure CMake (export compile commands)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release -- -j

      - name: Run binary (capture output)
        id: run-binary
        run: |
          # adjust executable path if your target name differs
          EXE="./build/CPPProject"
          if [ -x "$EXE" ]; then
            "$EXE" | tee run-output.txt
          else
            echo "No executable found at $EXE" > run-output.txt
            ls -la build || true
            exit 1
          fi

      - name: Run cppcheck (XML)
        run: |
          cppcheck --enable=all --inconclusive --force --xml --xml-version=2 src 2> cppcheck-report.xml || true

      - name: Report cppcheck to PR (reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          /usr/local/bin/reviewdog -f=cppcheck -name="cppcheck" \
            -reporter=github-pr-review -filter-mode=added -level=warning < cppcheck-report.xml || true

      - name: Run clang-tidy (using compile_commands)
        run: |
          FILES=$(find src -name '*.cpp' -or -name '*.cc' -or -name '*.cxx')
          if [ -n "$FILES" ]; then
            clang-tidy -p build $FILES 2> clang-tidy.out || true
          else
            echo "No source files found for clang-tidy" > clang-tidy.out
          fi

      - name: Report clang-tidy to PR (reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          /usr/local/bin/reviewdog -f=clang-tidy -name="clang-tidy" \
            -reporter=github-pr-review -filter-mode=added -level=warning < clang-tidy.out || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: cpp

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2