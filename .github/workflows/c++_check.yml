name: CI - Build, Lint, SAST (PR)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang clang-tidy cppcheck git

      - name: Setup Go (to install reviewdog)
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'

      - name: Install reviewdog CLI
        run: |
          go install github.com/reviewdog/reviewdog/cmd/reviewdog@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Configure CMake (export compile commands)
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release -- -j

      - name: Run binary (capture output)
        id: run-binary
        run: |
          if [ -x build/CPPProject ]; then
            ./build/CPPProject | tee run-output.txt
          else
            echo "No executable found" > run-output.txt
            exit 1
          fi

      - name: Run cppcheck (XML)
        run: |
          cppcheck --enable=all --inconclusive --force --xml --xml-version=2 src 2> cppcheck-report.xml || true

      - name: Report cppcheck to PR (reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=cppcheck -name="cppcheck" \
            -reporter=github-pr-review -filter-mode=added -level=warning < cppcheck-report.xml || true

      - name: Run clang-tidy (using compile_commands)
        run: |
          # run clang-tidy over all .cpp files using compile_commands.json
          FILES=$(find src -name '*.cpp' -or -name '*.cc' -or -name '*.cxx')
          if [ -n "$FILES" ]; then
            clang-tidy -p build $FILES 2> clang-tidy.out || true
          else
            echo "No source files found for clang-tidy" > clang-tidy.out
          fi

      - name: Report clang-tidy to PR (reviewdog)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=clang-tidy -name="clang-tidy" \
            -reporter=github-pr-review -filter-mode=added -level=warning < clang-tidy.out || true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: cpp

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2